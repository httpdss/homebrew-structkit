name: Formula Check

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
  pull_request:
    branches: [main]
    paths:
      - 'Formula/**'

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit formula
        run: |
          brew audit --strict --online Formula/structkit.rb

      - name: Style check
        run: |
          brew style Formula/structkit.rb

      - name: Check for trailing whitespace
        run: |
          if grep -r '[[:blank:]]$' Formula/; then
            echo "Error: Trailing whitespace found"
            exit 1
          fi
